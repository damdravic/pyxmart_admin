<div class="flex flex-col w-min-32 p-3">
 @for (item of menuItems; track item) {
    <div class="item">
        @if(!item.children?.length){
             <a [routerLink]="item.route" class="block p-2 rounded hover:bg-slate-200">
            {{ item.label }}
        </a>
        }@else {
            <button type="button" class="w-full text-left p-2 rounded hover:bg-slate-200">
                {{item.label}}
            </button>
           <div class="pl-4">
               @for(child of item.children; track child){
                <a [routerLink]="child.route" class="block p-2 rounded hover:bg-slate-200">
            {{ child.label }}
        </a>
               }
           </div>
        }
    
    </div>
 }
</div>
