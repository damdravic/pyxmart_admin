<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-5xl overflow-hidden rounded-2xl bg-white shadow-xl lg:grid lg:grid-cols-2">

    <!-- Left: Register form -->
    <div class="flex items-center justify-center p-8 sm:p-12 lg:p-16">

      <div class="w-full max-w-md">

        <!-- Header -->
        <div class="mb-8">

          <a
            routerLink="/"
            class="text-2xl font-extrabold tracking-tight text-slate-900"
          >
            PyXmart
          </a>

          <h1 class="mt-8 text-3xl font-bold tracking-tight text-slate-900">
            Create your account
          </h1>

          <p class="mt-2 text-sm text-slate-500">
            Join PyXmart and start shopping today.
          </p>

        </div>

        <!-- Form -->
        <form class="space-y-5">

          <!-- Username -->
          <div>
            <label
              for="username"
              class="mb-2 block text-sm font-medium text-slate-700"
            >
              Username
            </label>

            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Choose a username"
              class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
            />
          </div>

          <!-- Email -->
          <div>
            <label
              for="email"
              class="mb-2 block text-sm font-medium text-slate-700"
            >
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="mb-2 block text-sm font-medium text-slate-700"
            >
              Password
            </label>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Create a password"
              class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
            />
          </div>

          <!-- Confirm password -->
          <div>
            <label
              for="confirmPassword"
              class="mb-2 block text-sm font-medium text-slate-700"
            >
              Confirm password
            </label>

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Repeat your password"
              class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
            />
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full rounded-lg bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
          >
            Create account
          </button>

        </form>

        <!-- Login -->
        <p class="mt-8 text-center text-sm text-slate-500">

          Already have an account?

          <a
            routerLink="/auth"
            class="font-semibold text-slate-900 hover:underline"
          >
            Sign in
          </a>

        </p>

      </div>
    </div>

    <!-- Right: Image -->
    <div class="relative hidden min-h-162.5 lg:block">

      <img
        src="/images/register.jpg"
        alt="Create your PyXmart account"
        class="absolute inset-0 h-full w-full object-cover"
      />

      <div class="absolute inset-0 bg-slate-900/30"></div>

      <div class="absolute inset-x-0 bottom-0 p-12 text-white">

        <h2 class="text-3xl font-bold">
          Welcome to PyXmart.
        </h2>

        <p class="mt-3 max-w-md text-sm leading-6 text-white/80">
          Create your account and discover a better way to shop.
        </p>

      </div>

    </div>

  </div>

</div>
