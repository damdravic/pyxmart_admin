<!-- Header -->
    <div class="flex items-center justify-between border-b border-gray-200 pb-4 mb-6">
      <h2 class="text-xl font-semibold text-gray-800">
        Add New Brand
      </h2>

      <button
        type="button"
        (click)="closeDialog()"
        class="text-gray-400 hover:text-gray-700 text-xl">
        &times;
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="brandForm" (ngSubmit)="onSubmit()">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Brand Name *
          </label>
          <input
            type="text"
            formControlName="name"
            placeholder="Enter brand name"
            class="w-full rounded-lg border border-gray-300 px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Slug -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Slug *
          </label>
          <input
            type="text"
            formControlName="slug"
            placeholder="brand-slug"
            class="w-full rounded-lg border border-gray-300 px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Description -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Description
          </label>
          <textarea
            formControlName="description"
            rows="3"
            placeholder="Brand description"
            class="w-full rounded-lg border border-gray-300 px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
                   ></textarea>
        </div>

        <!-- Logo URL -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Logo URL
          </label>
          <input
            type="file"
            accept="image/*"
            (change)="onLogoSelected($event)"
            class="w-full rounded-lg border border-gray-300 px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Secondary Logo URL -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Secondary Logo URL
          </label>
          <input
            type="url"
            formControlName="logoUrlSecondary"
            placeholder="https://..."
            class="w-full rounded-lg border border-gray-300 px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Active -->
        <div class="md:col-span-2 flex items-center gap-3">
          <input
            type="checkbox"
            formControlName="active"
            class="w-4 h-4 accent-blue-600" />

          <label class="text-sm font-medium text-gray-700">
            Active
          </label>
        </div>
        @if(errMessage() != null){
          <p>{{errMessage()}}</p>
        }

      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-3 mt-8 pt-5 border-t border-gray-200">

        <button
          type="button"
          (click)="closeDialog()"
          class="px-4 py-2.5 rounded-lg border border-gray-300
                 text-gray-700 hover:bg-gray-50">
          Cancel
        </button>

        <button
          type="submit"
          [disabled]="brandForm.invalid "
          class="px-5 py-2.5 rounded-lg bg-blue-600 text-white
                 hover:bg-blue-700 disabled:opacity-50">
         @if(editMode() == true){
          Edit Brand
         } @else {
          Save Brand
         }
        </button>

      </div>

    </form>
